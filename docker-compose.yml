# MerchantOS local parity stack (ADR-066).
# Data plane always on; app is optional production image:
#   docker compose --profile app up --build

name: merchantos

services:
  app:
    profiles:
      - app
    build:
      context: .
      dockerfile: Dockerfile
    image: merchantos-app:local
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      MOS_ENV: ${MOS_ENV:-local}
      AUTH_SECRET: ${AUTH_SECRET:-change-me-auth-secret}
      DATABASE_URL: postgres://${POSTGRES_USER:-merchantos}:${POSTGRES_PASSWORD:-merchantos}@postgres:5432/${POSTGRES_DB:-merchantos}
      REDIS_URL: redis://redis:6379
      MONGODB_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME:-merchantos}:${MONGO_INITDB_ROOT_PASSWORD:-merchantos}@mongo:27017/${MONGO_DB:-merchantos_analytics}?authSource=admin
      MQTT_URL: mqtt://emqx:1883
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_CONSOLE_URL: http://minio:9001
      MOS_ALLOW_SANDBOX_PAYMENT_CONFIRM: ${MOS_ALLOW_SANDBOX_PAYMENT_CONFIRM:-1}
      # Local Docker parity: return OTP in JSON when MOS_ENV=local (also honors explicit flag)
      MOS_RETURN_DEV_OTP: ${MOS_RETURN_DEV_OTP:-}
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      emqx:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - merchantos

  # ADR-109 — transactional outbox + scheduled jobs (pickup timers / loyalty expiry).
  worker:
    profiles:
      - worker
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    command:
      [
        "sh",
        "-c",
        "if [ ! -x node_modules/.bin/tsx ]; then npm ci; fi; npx tsx src/workers/outbox-worker.ts",
      ]
    environment:
      NODE_ENV: development
      MOS_ENV: ${MOS_ENV:-local}
      DATABASE_URL: postgres://${POSTGRES_USER:-merchantos}:${POSTGRES_PASSWORD:-merchantos}@postgres:5432/${POSTGRES_DB:-merchantos}
      REDIS_URL: redis://redis:6379
      MONGODB_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME:-merchantos}:${MONGO_INITDB_ROOT_PASSWORD:-merchantos}@mongo:27017/${MONGO_DB:-merchantos_analytics}?authSource=admin
      MQTT_URL: mqtt://emqx:1883
      MOS_MQTT_MODE: live
      MOS_OUTBOX_POLL_MS: ${MOS_OUTBOX_POLL_MS:-1000}
      MOS_SCHEDULED_JOB_MS: ${MOS_SCHEDULED_JOB_MS:-60000}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    depends_on:
      postgres:
        condition: service_healthy
      emqx:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - merchantos

  postgres:
    # Debian-based image ships C.UTF-8 so Persian (fa) text init is reliable.
    image: postgres:16
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-merchantos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-merchantos}
      POSTGRES_DB: ${POSTGRES_DB:-merchantos}
      # UTF-8 init so Persian OLTP text stores without mojibake (Iranian First).
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - merchantos

  mongo:
    image: mongo:7
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-merchantos}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-merchantos}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-merchantos_analytics}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --quiet --eval \"db.adminCommand('ping').ok\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - merchantos

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - merchantos

  emqx:
    image: emqx/emqx:5.8.3
    ports:
      - "${EMQX_MQTT_PORT:-1883}:1883"
      - "${EMQX_WS_PORT:-8083}:8083"
      - "${EMQX_DASHBOARD_PORT:-18083}:18083"
    environment:
      EMQX_NAME: merchantos
      EMQX_HOST: 127.0.0.1
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${EMQX_DASHBOARD_USER:-admin}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:-public}
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - merchantos

  minio:
    image: minio/minio:latest
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - merchantos

networks:
  merchantos:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  minio_data:
  app_node_modules:
